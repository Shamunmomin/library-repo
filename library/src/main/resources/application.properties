spring.application.name=library

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A7134743777217A25432A462D4A614E645267556B58703272357538782F413F4428472B4B6250
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${user.dir}/uploads

# Rate Limiting
app.rate-limit.login-capacity=5
app.rate-limit.login-refill=5
app.rate-limit.register-capacity=3
app.rate-limit.register-refill=3
app.rate-limit.refill-minutes=1

# Subscription Lifecycle
app.subscription.months-per-cycle=1
app.subscription.grace-period-days=3
app.subscription.expiry-cron=0 0 6 * * *
app.subscription.reminder-days-before=3,1

# Member Fee Lifecycle
app.member-fee.expiry-cron=0 0 4 * * *
app.member-fee.reminder-days-before=3,1

# Notifications
app.frontend-url=https://shamunmomin.github.io
app.notifications.frontend-url=https://shamunmomin.github.io/library-repo
app.notifications.mail.enabled=true
